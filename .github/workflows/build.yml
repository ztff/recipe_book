name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 同一 ref 的新推送会取消旧运行；tag 与分支的 ref 不同，互不干扰
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter Gradle 插件会要求这个版本的 NDK；预装可以跳过它那张不靠谱的自动安装。
  NDK_VERSION: '28.2.13676358'

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 定位 Android SDK
        run: echo "SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: 缓存 NDK
        uses: actions/cache@v6
        with:
          path: ${{ env.SDK_ROOT }}/ndk
          key: ndk-${{ env.NDK_VERSION }}

      - name: 预装 NDK
        run: |
          if [ -d "$SDK_ROOT/ndk/$NDK_VERSION" ]; then
            echo 'NDK 已缓存，跳过下载'
            exit 0
          fi
          for i in 1 2 3; do
            echo "安装 NDK 第 ${i} 次尝试"
            if "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"; then
              break
            fi
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION"
            sleep 15
          done
          test -d "$SDK_ROOT/ndk/$NDK_VERSION" || { echo 'NDK 安装失败'; exit 1; }

      - name: 还原发布签名
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo '已还原签名密钥，将使用自有 keystore 签名'
          else
            echo '未配置签名 secrets，本次构建回退到 debug 签名'
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - name: 校验签名
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          BT="$(ls -d $SDK_ROOT/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK"

      - uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  windows:
    name: Windows 桌面
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 打包
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath recipe-book-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: recipe-book-windows-x64.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成发布说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## v${VERSION} 更新内容"
            echo
            if grep -q "^## ${VERSION}$" CHANGELOG.md; then
              awk -v v="${VERSION}" '/^## /{ if (found) exit; if ($2 == v) { found=1; next } } found' CHANGELOG.md
            else
              echo "（CHANGELOG.md 里没有 ${VERSION} 的条目）"
            fi
            echo
            echo "---"
            echo
            cat .github/release-body.md
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
