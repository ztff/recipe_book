version: 2
updates:
  # GitHub Actions 版本（checkout / setup-java / flutter-action 等）
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ['*']

  # Dart / Flutter 依赖（pubspec.yaml）
  - package-ecosystem: 'pub'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'Asia/Shanghai'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
    labels:
      - dependencies
      - dart
    # 合并成一个 PR，避免每周刷屏；Flutter SDK 相关包由 Flutter 版本决定，不动
    groups:
      dart-deps:
        patterns: ['*']
        exclude-patterns:
          - 'flutter_lints'

  # Android Gradle 插件与依赖
  - package-ecosystem: 'gradle'
    directory: '/android'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore'
    labels:
      - dependencies
      - android
